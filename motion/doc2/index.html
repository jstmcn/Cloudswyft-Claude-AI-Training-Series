<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #ffffff; }
      #root { position: relative; width: 100%; height: 100%; font-family: "Poppins", sans-serif; color: #0b1e46; overflow: hidden; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .bg { position: absolute; inset: 0; }
      .big { position: absolute; font-weight: 700; letter-spacing: -0.03em; text-transform: uppercase; white-space: nowrap; line-height: 0.9; }
      .quiet { position: absolute; font-weight: 700; font-size: 56px; letter-spacing: -0.02em; text-transform: uppercase; white-space: nowrap; }
      .claude { color: #d97757; }
      .slot { position: absolute; overflow: hidden; }
      .reel { position: absolute; left: 0; top: 0; }
      .reel > div { font-weight: 700; letter-spacing: -0.03em; text-transform: uppercase; white-space: nowrap; }
      .hide { opacity: 0; }

      /* the clock that stays on screen for the whole day */
      #clock { position: absolute; left: 120px; top: 60px; width: 900px; height: 230px; z-index: 20; }
      #clock .reel > div { height: 230px; line-height: 230px; font-size: 210px; }

      /* A · 9:00 research brief */
      #a-brief { left: 120px; top: 370px; font-size: 170px; }
      .cite { position: absolute; top: 590px; width: 120px; height: 120px; border-radius: 24px; background: #1aa6ec; color: #0b1e46; font-weight: 700; font-size: 64px; display: flex; align-items: center; justify-content: center; opacity: 0; }
      #a-c1 { left: 120px; } #a-c2 { left: 270px; } #a-c3 { left: 420px; }
      #a-cited { left: 600px; top: 624px; }

      /* B · 11:00 policy summary */
      #b-num { left: 120px; top: 330px; width: 560px; height: 400px; }
      #b-num .reel > div { height: 400px; line-height: 400px; font-size: 380px; }
      #b-word { left: 640px; top: 430px; width: 1100px; height: 200px; }
      #b-word .reel > div { height: 200px; line-height: 200px; font-size: 170px; }
      #b-stack { position: absolute; left: 1460px; top: 300px; width: 380px; height: 470px; }
      .page { position: absolute; width: 300px; height: 390px; border: 14px solid #0b1e46; border-radius: 18px; background: #ffffff; }
      #b-hires { left: 124px; top: 760px; }

      /* C · 14:00 bug fixed */
      #c-code { position: absolute; left: 120px; top: 350px; width: 860px; height: 220px; border-radius: 28px; background: #ffffff; }
      #c-code span { position: absolute; left: 64px; top: 40px; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 120px; line-height: 140px; color: #0b1e46; }
      .mark { position: absolute; left: 1030px; top: 350px; width: 220px; height: 220px; border-radius: 50%; background: #ffffff; opacity: 0; }
      .mark svg { position: absolute; left: 40px; top: 40px; width: 140px; height: 140px; }
      #c-word { left: 120px; top: 640px; width: 1300px; height: 210px; }
      #c-word .reel > div { height: 210px; line-height: 210px; font-size: 190px; }

      /* D · 16:00 chart, checked */
      #d-chart { position: absolute; left: 1240px; top: 320px; width: 560px; height: 460px; }
      #d-chartw { left: 120px; top: 330px; font-size: 200px; }
      #d-claude { left: 120px; top: 540px; font-size: 130px; }
      #d-checked { left: 120px; top: 700px; font-size: 130px; }
      #d-person { position: absolute; left: 840px; top: 680px; width: 150px; height: 150px; opacity: 0; }

      /* E · end card */
      #e-title { left: 120px; top: 210px; font-size: 200px; }
      #e-title span { display: inline-block; margin-right: 0.2em; }
      #e-bar { position: absolute; left: 120px; top: 600px; width: 900px; height: 22px; border-radius: 11px; background: #1aa6ec; }
      #e-sub { position: absolute; left: 124px; top: 650px; font-family: "Open Sans", sans-serif; font-weight: 700; font-size: 52px; white-space: nowrap; }
      #e-plate { position: absolute; left: 120px; top: 760px; width: 560px; height: 140px; border-radius: 28px; background: #eaf6fd; }
      #e-plate img { position: absolute; left: 50px; top: 30px; height: 80px; width: auto; }
    </style>
  </head>
  <body>
    <!-- Doc 2 · A Day With Claude. Voice is the clock; see ../SPEC.md. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="34" data-width="1920" data-height="1080">

      <!-- A · 9:00 -->
      <div id="sa" class="clip scene" data-start="0" data-duration="6.4" data-track-index="1" style="z-index: 1">
        <div class="bg" style="background: #ffffff"></div>
        <div class="big" id="a-brief">Research brief</div>
        <div class="cite" id="a-c1">1</div>
        <div class="cite" id="a-c2">2</div>
        <div class="cite" id="a-c3">3</div>
        <div class="quiet" id="a-cited">Every source cited</div>
      </div>

      <!-- B · 11:00 -->
      <div id="sb" class="clip scene" data-start="6.0" data-duration="6.2" data-track-index="2" style="z-index: 2">
        <div class="bg" id="b-bg" style="background: #eaf6fd"></div>
        <div id="b-stack" data-layout-ignore>
          <div class="page" id="b-p1" style="left: 0; top: 0"></div>
          <div class="page" id="b-p2" style="left: 26px; top: 26px"></div>
          <div class="page" id="b-p3" style="left: 52px; top: 52px"></div>
          <div class="page" id="b-p4" style="left: 78px; top: 78px"></div>
        </div>
        <div class="slot" data-layout-allow-overflow id="b-num"><div class="reel" id="b-numreel"><div>40</div><div>1</div></div></div>
        <div class="slot" data-layout-allow-overflow id="b-word"><div class="reel" id="b-wordreel"><div>Pages</div><div>Summary</div></div></div>
        <div class="quiet" id="b-hires">For new hires</div>
      </div>

      <!-- C · 14:00 -->
      <div id="sc" class="clip scene" data-start="11.8" data-duration="6.2" data-track-index="1" style="z-index: 3">
        <div class="bg" id="c-bg" style="background: #1aa6ec"></div>
        <div id="c-code"><span>login()</span></div>
        <div class="mark" id="c-x"><svg viewBox="0 0 140 140" fill="none" stroke="#0b1e46" stroke-width="18" stroke-linecap="round"><line x1="30" y1="30" x2="110" y2="110" /><line x1="110" y1="30" x2="30" y2="110" /></svg></div>
        <div class="mark" id="c-ok"><svg viewBox="0 0 140 140" fill="none" stroke="#0b1e46" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"><polyline points="24,74 58,106 118,36" /></svg></div>
        <div class="slot" data-layout-allow-overflow id="c-word"><div class="reel" id="c-wordreel"><div>Failing</div><div>Fixed</div></div></div>
      </div>

      <!-- D · 16:00 -->
      <div id="sd" class="clip scene" data-start="17.6" data-duration="7.2" data-track-index="2" style="z-index: 4">
        <div class="bg" id="d-bg" style="background: #ffffff"></div>
        <svg id="d-chart" viewBox="0 0 560 460" fill="none" stroke="#0b1e46" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20,20 20,440 540,440" />
          <rect class="d-bar" x="70" y="300" width="80" height="140" fill="#0b1e46" />
          <rect class="d-bar" x="190" y="220" width="80" height="220" fill="#0b1e46" />
          <rect class="d-bar" x="310" y="260" width="80" height="180" fill="#0b1e46" />
          <rect class="d-bar" x="430" y="120" width="80" height="320" fill="#1aa6ec" />
        </svg>
        <div class="big" id="d-chartw">Chart</div>
        <div class="big" id="d-claude">By <span class="claude">Claude</span></div>
        <div class="big" id="d-checked">Checked</div>
        <svg id="d-person" viewBox="0 0 150 150" fill="none" stroke="#0b1e46" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="58" cy="44" r="28" /><path d="M10 140 C10 100 34 84 58 84 C72 84 84 88 94 96" /><polyline points="88,118 106,136 142,96" />
        </svg>
      </div>

      <!-- E · end card -->
      <div id="se" class="clip scene" data-start="24.4" data-duration="9.6" data-track-index="1" style="z-index: 5">
        <div class="bg" id="e-bg" style="background: #ffffff"></div>
        <div class="big" id="e-title" data-hold><span>A</span><span>day</span><span>with</span><br /><span class="claude">Claude</span></div>
        <div id="e-bar" data-hold></div>
        <div id="e-sub" data-hold>Part 3 · What <span class="claude">Claude</span> Can Do</div>
        <div id="e-plate" data-hold data-layout-allow-overflow><img src="assets/cloudswyft-logo-on-light.png" alt="CloudSwyft" /></div>
      </div>

      <!-- The clock, above every scene until the end card -->
      <div id="clockclip" class="clip" data-start="0" data-duration="24.4" data-track-index="3" style="position: absolute; inset: 0; z-index: 20">
        <div class="slot" data-layout-allow-overflow id="clock"><div class="reel" id="clockreel"><div>9:00</div><div>11:00</div><div>14:00</div><div>16:00</div></div></div>
      </div>

      <audio id="voice" class="clip" src="assets/doc2.mp3" data-start="0" data-duration="23.68" data-track-index="5" data-volume="1"></audio>
      <audio id="pop1" class="clip" src="assets/sfx-pop.mp3" data-start="2.51" data-duration="0.3" data-track-index="6" data-volume="0.6"></audio>
      <audio id="pop2" class="clip" src="assets/sfx-pop.mp3" data-start="2.81" data-duration="0.3" data-track-index="6" data-volume="0.7"></audio>
      <audio id="pop3" class="clip" src="assets/sfx-pop.mp3" data-start="3.11" data-duration="0.3" data-track-index="6" data-volume="0.8"></audio>
      <audio id="pop4" class="clip" src="assets/sfx-pop.mp3" data-start="12.91" data-duration="0.3" data-track-index="6" data-volume="0.7"></audio>
      <audio id="pop5" class="clip" src="assets/sfx-pop.mp3" data-start="14.91" data-duration="0.3" data-track-index="6" data-volume="0.8"></audio>
      <audio id="pop6" class="clip" src="assets/sfx-pop.mp3" data-start="21.81" data-duration="0.3" data-track-index="6" data-volume="0.7"></audio>
      <audio id="wh1" class="clip" src="assets/sfx-whoosh.mp3" data-start="5.5" data-duration="1.2" data-track-index="7" data-volume="0.24" data-fade-out="0.4"></audio>
      <audio id="wh2" class="clip" src="assets/sfx-whoosh.mp3" data-start="11.3" data-duration="1.2" data-track-index="7" data-volume="0.28" data-fade-out="0.4"></audio>
      <audio id="wh3" class="clip" src="assets/sfx-whoosh.mp3" data-start="17.1" data-duration="1.2" data-track-index="7" data-volume="0.24" data-fade-out="0.4"></audio>
      <audio id="wh4" class="clip" src="assets/sfx-whoosh.mp3" data-start="23.9" data-duration="1.4" data-track-index="7" data-volume="0.28" data-fade-out="0.5"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const land = (sel, t, blur = 10) =>
        tl.fromTo(sel, { opacity: 0, filter: `blur(${blur}px)` }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power4.out" }, t);
      const pop = (sel, t) => {
        tl.set(sel, { opacity: 1 }, t);
        tl.fromTo(sel, { scale: 0 }, { scale: 1, duration: 0.45, ease: "elastic.out(1, 0.55)" }, t);
      };
      const out = (sels, t) => tl.to(sels, { opacity: 0, filter: "blur(10px)", duration: 0.18, ease: "power2.in" }, t);
      // Slot-machine roll; the option that rolled away is switched off so it never sits hidden under the frame.
      const roll = (sel, toY, t, first, gone) => {
        tl.fromTo(sel, { y: toY.from }, { y: toY.to, duration: 0.3, ease: "power3.out", immediateRender: !!first }, t);
        if (gone) tl.set(gone, { opacity: 0 }, t + 0.3);
      };

      // The clock rolls on each spoken hour.
      roll("#clockreel", { from: 0, to: -230 }, 6.1, true, "#clockreel > div:nth-child(1)");
      roll("#clockreel", { from: -230, to: -460 }, 11.85, false, "#clockreel > div:nth-child(2)");
      roll("#clockreel", { from: -460, to: -690 }, 17.66, false, "#clockreel > div:nth-child(3)");
      out("#clock", 24.2);

      // A · "A research brief, with every source cited."
      land("#a-brief", 1.3);
      pop("#a-c1", 2.6);
      pop("#a-c2", 2.9);
      pop("#a-c3", 3.2);
      land("#a-cited", 3.4, 8);

      // B · ice wipes in from the right. "A forty-page policy, summarized for new hires."
      tl.fromTo("#b-bg", { clipPath: "inset(0 0 0 100%)" }, { clipPath: "inset(0 0 0 0%)", duration: 0.4, ease: "power2.inOut" }, 6.0);
      land("#b-num", 7.1);
      land("#b-word", 7.25);
      tl.fromTo("#b-stack", { opacity: 0, x: 120 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, 7.2);
      // ...summarized: the stack collapses into one page, 40 PAGES rolls to 1 SUMMARY.
      tl.to(["#b-p2", "#b-p3", "#b-p4"], { x: (i) => -26 * (i + 1), y: (i) => -26 * (i + 1), duration: 0.35, ease: "power3.inOut" }, 8.15);
      roll("#b-numreel", { from: 0, to: -400 }, 8.25, true, "#b-numreel > div:nth-child(1)");
      roll("#b-wordreel", { from: 0, to: -200 }, 8.3, true, "#b-wordreel > div:nth-child(1)");
      tl.fromTo("#b-word", { x: 0 }, { x: -300, duration: 0.35, ease: "power3.out" }, 8.3); // close the gap "1" leaves
      land("#b-hires", 9.0, 8);

      // C · sky wipes down. "A failing login function, found and fixed."
      tl.fromTo("#c-bg", { clipPath: "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0% 0)", duration: 0.4, ease: "power2.inOut" }, 11.8);
      tl.fromTo("#c-code", { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, 12.6);
      land("#c-word", 13.0);
      pop("#c-x", 13.0);
      tl.to("#c-x", { opacity: 0, scale: 0.6, duration: 0.15, ease: "power2.in" }, 14.85);
      pop("#c-ok", 15.0);
      roll("#c-wordreel", { from: 0, to: -210 }, 14.95, true, "#c-wordreel > div:nth-child(1)");

      // D · white wipes in from the left. "An enrollment chart, built by Claude, checked by a person."
      tl.fromTo("#d-bg", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.4, ease: "power2.inOut" }, 17.6);
      tl.fromTo("#d-chart", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 18.9);
      tl.fromTo("#d-chart .d-bar", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.45, stagger: 0.09, ease: "expo.out" }, 18.95);
      land("#d-chartw", 19.0);
      land("#d-claude", 20.5);
      land("#d-checked", 21.2);
      pop("#d-person", 21.9);

      // E · end card: everything clears, white wipes up, the title lands word by word.
      tl.fromTo("#e-bg", { clipPath: "inset(100% 0 0 0)" }, { clipPath: "inset(0% 0 0 0)", duration: 0.4, ease: "power2.inOut" }, 24.4);
      tl.fromTo("#e-title span", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.09, ease: "power4.out" }, 24.9);
      tl.fromTo("#e-bar", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 25.4);
      land("#e-sub", 25.6, 8);
      tl.fromTo("#e-plate", { y: 420 }, { y: 0, duration: 0.6, ease: "expo.out" }, 26.0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
