  <div id="root" data-composition-id="s2" data-width="1920" data-height="1080">

  <script>
    const tl = gsap.timeline({ paused: true });

    // Fields: ice wipes in from the right on "chat", blue from the left on "assistants".
    tl.fromTo("#s2-ice", { clipPath: "inset(0 0 0 100%)" }, { clipPath: "inset(0 0 0 0%)", duration: 0.4, ease: "power2.inOut" }, 2.3);
    tl.fromTo("#s2-blue", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.4, ease: "power2.inOut" }, 3.82);

    // SEARCH: the bar arrives (morph from a pill dot), the word lands on "search".
    tl.fromTo("#s2-card", { clipPath: "inset(0px 1260px 0px 0px round 130px)" }, { clipPath: "inset(0px 0px 0px 0px round 0px)", duration: 0.45, ease: "power3.out" }, 0.25);
    tl.set("#s2-card", { clipPath: "none" }, 0.72); // let the bubble tail hang outside later
    tl.fromTo("#s2-slot", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power4.out" }, 0.73);

    // ...that list links: three result lines draw on.
    ["#s2-l1", "#s2-l2", "#s2-l3"].forEach((sel, i) => {
      tl.fromTo(sel, { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.35, ease: "expo.out" }, 1.15 + i * 0.12);
    });
    tl.to(["#s2-l1", "#s2-l2", "#s2-l3"], { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power2.in" }, 2.25);

    // CHAT: the bar becomes a bubble, the reel rolls.
    tl.to("#s2-card", { borderRadius: 64, duration: 0.3, ease: "power3.out" }, 2.4);
    tl.set("#s2-tail", { opacity: 1 }, 2.5);
    tl.fromTo("#s2-tail", { scale: 0, transformOrigin: "0% 0%" }, { scale: 1, duration: 0.4, ease: "elastic.out(1, 0.6)" }, 2.5);
    tl.set("#s2-i-search", { opacity: 0 }, 2.5);
    tl.set("#s2-i-chat", { opacity: 1 }, 2.5);
    tl.fromTo("#s2-reel", { y: 0 }, { y: -260, duration: 0.28, ease: "power3.out" }, 2.36);

    // ASSISTANT: the bubble squares up into a panel, the reel rolls again.
    tl.to("#s2-card", { borderRadius: 40, duration: 0.3, ease: "power3.out" }, 3.9);
    tl.to("#s2-tail", { opacity: 0, duration: 0.12 }, 3.9);
    tl.set("#s2-i-chat", { opacity: 0 }, 4.0);
    tl.set("#s2-i-asst", { opacity: 1 }, 4.0);
    tl.fromTo("#s2-reel", { y: -260 }, { y: -520, duration: 0.28, ease: "power3.out", immediateRender: false }, 3.88);

    // ...that help finish the work: the check pops, the line lands word by word.
    tl.set("#s2-check", { opacity: 1 }, 5.36);
    tl.fromTo("#s2-check", { scale: 0 }, { scale: 1, duration: 0.45, ease: "elastic.out(1, 0.55)" }, 5.36);
    tl.fromTo("#s2-done span", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.08, ease: "power4.out" }, 5.6);

    // Exit: everything whips left into the next shot.
    tl.to("#s2-move", { x: -2300, filter: "blur(16px)", duration: 0.32, ease: "power3.in" }, 8.05);

    window.__timelines["s2"] = tl;
  </script>
