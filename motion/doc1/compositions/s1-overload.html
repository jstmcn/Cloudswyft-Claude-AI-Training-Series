    // Frame 0 already reads: "EVERY DAY" is on screen (visible from CSS).

    // "...keep coming": the words multiply and tile the frame, rows alternating sides.

      tl.fromTo(`#s1-r${i}`, { x: fromX, opacity: 0.12 }, { x: 0, opacity: 0.12, duration: 0.5, ease: "expo.out", immediateRender: false }, 3.95 + i * 0.07);

    // Everything clears except the 99+ badge, which grows into the next field.

    tl.fromTo("#s1-grow", { scale: 1 }, { scale: 26, duration: 0.5, ease: "power3.in" }, 5.88);
