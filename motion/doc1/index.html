<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --white: #ffffff;
        --ice: #eaf6fd;
        --sky: #1aa6ec;
        --blue: #0e7bb5;
        --navy: #0b1e46;
        --coral: #d97757;
        --font-display: "Poppins", sans-serif;
        --font-body: "Open Sans", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--white);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
        color: var(--navy);
      }
    </style>
  </head>
  <body>
    <!-- Doc 1 · The Future of Work. Voice is the clock; see ../SPEC.md for every shot. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="35" data-width="1920" data-height="1080">
      <div id="s1" data-composition-id="s1" data-composition-src="compositions/s1-overload.html" data-start="0" data-duration="6.4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s2" data-composition-id="s2" data-composition-src="compositions/s2-evolution.html" data-start="6.4" data-duration="8.4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s3" data-composition-id="s3" data-composition-src="compositions/s3-results.html" data-start="14.8" data-duration="6.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s4" data-composition-id="s4" data-composition-src="compositions/s4-line.html" data-start="21" data-duration="14" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <!-- Voice -->
      <audio id="voice" class="clip" src="assets/doc1.mp3" data-start="0" data-duration="24.71" data-track-index="5" data-volume="1"></audio>

      <!-- Pops: start 0.09 s before the picture so the hit lands one frame after it -->
      <audio id="pop1" class="clip" src="assets/sfx-pop.mp3" data-start="2.71" data-duration="0.3" data-track-index="6" data-volume="0.7"></audio>
      <audio id="pop2" class="clip" src="assets/sfx-pop.mp3" data-start="3.01" data-duration="0.3" data-track-index="6" data-volume="0.6"></audio>
      <audio id="pop3" class="clip" src="assets/sfx-pop.mp3" data-start="3.31" data-duration="0.3" data-track-index="6" data-volume="0.7"></audio>
      <audio id="pop4" class="clip" src="assets/sfx-pop.mp3" data-start="3.61" data-duration="0.3" data-track-index="6" data-volume="0.8"></audio>
      <audio id="pop5" class="clip" src="assets/sfx-pop.mp3" data-start="11.71" data-duration="0.3" data-track-index="6" data-volume="0.8"></audio>

      <!-- Whooshes on the colour floods: start 0.72 s before the flood lands -->
      <audio id="wh1" class="clip" src="assets/sfx-whoosh.mp3" data-start="5.5" data-duration="1.3" data-track-index="7" data-volume="0.3" data-fade-out="0.4"></audio>
      <audio id="wh2" class="clip" src="assets/sfx-whoosh.mp3" data-start="8.2" data-duration="1.2" data-track-index="7" data-volume="0.22" data-fade-out="0.4"></audio>
      <audio id="wh3" class="clip" src="assets/sfx-whoosh.mp3" data-start="9.8" data-duration="1.2" data-track-index="7" data-volume="0.26" data-fade-out="0.4"></audio>
      <audio id="wh4" class="clip" src="assets/sfx-whoosh.mp3" data-start="24.6" data-duration="1.4" data-track-index="7" data-volume="0.3" data-fade-out="0.5"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
