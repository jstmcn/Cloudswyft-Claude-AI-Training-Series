<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #ffffff; }
      #root { position: relative; width: 100%; height: 100%; font-family: "Poppins", sans-serif; color: #0b1e46; overflow: hidden; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .bg { position: absolute; inset: 0; }
      .big { position: absolute; font-weight: 700; letter-spacing: -0.03em; text-transform: uppercase; white-space: nowrap; line-height: 0.9; }
      .quiet { position: absolute; font-weight: 700; font-size: 52px; letter-spacing: -0.02em; text-transform: uppercase; white-space: nowrap; }
      .slot { position: absolute; overflow: hidden; }
      .reel { position: absolute; left: 0; top: 0; }
      .reel > div { font-weight: 700; letter-spacing: -0.03em; text-transform: uppercase; white-space: nowrap; }

      /* A · same task, two ways */
      #a-task { left: 120px; top: 290px; font-size: 220px; }
      #a-ways { left: 120px; top: 530px; font-size: 220px; color: #0e7bb5; }

      /* B · the old way vs one prompt */
      #b-right { position: absolute; left: 960px; top: 0; width: 960px; height: 1080px; background: #1aa6ec; }
      #b-old { left: 80px; top: 110px; }
      #b-new { left: 1040px; top: 110px; }
      .churn { position: absolute; left: 80px; font-size: 120px; }
      #b-w1 { top: 250px; } #b-w2 { top: 390px; } #b-w3 { top: 530px; } #b-w4 { top: 670px; color: #0e7bb5; }
      #b-box { position: absolute; left: 1040px; top: 250px; width: 800px; height: 300px; border-radius: 32px; background: #ffffff; }
      .pl { position: absolute; left: 60px; height: 24px; border-radius: 12px; background: #0b1e46; }
      #b-l1 { top: 70px; width: 560px; } #b-l2 { top: 130px; width: 640px; } #b-l3 { top: 190px; width: 420px; }
      #b-cursor { position: absolute; left: 500px; top: 180px; width: 10px; height: 46px; background: #0b1e46; }
      #b-done { position: absolute; left: 1720px; top: 190px; width: 160px; height: 160px; border-radius: 50%; background: #ffffff; border: 10px solid #0b1e46; opacity: 0; }
      #b-done svg { position: absolute; left: 20px; top: 20px; width: 100px; height: 100px; }
      #b-prompt { left: 1040px; top: 620px; font-size: 104px; line-height: 1; }
      #b-prompt span { display: inline-block; margin-right: 0.22em; }

      /* C · both meet at review */
      #c-paths { position: absolute; left: 0; top: 140px; width: 1920px; height: 160px; }
      #c-word { left: 120px; top: 420px; width: 1500px; height: 230px; }
      #c-word .reel > div { height: 230px; line-height: 230px; font-size: 200px; }
      #c-person { position: absolute; left: 1280px; top: 300px; width: 460px; height: 460px; opacity: 0; }
      #c-a { left: 120px; top: 330px; font-size: 200px; }
      #c-rev { left: 120px; top: 560px; font-size: 200px; color: #0e7bb5; }

      /* D · you stay in the loop */
      #d-you { left: 160px; top: 250px; font-size: 330px; }
      #d-loop { position: absolute; left: 60px; top: 150px; width: 1000px; height: 520px; }
      #d-line { left: 1080px; top: 330px; font-size: 104px; line-height: 1; }
      #d-line span { display: block; }

      /* E · end card */
      #e-title { left: 120px; top: 230px; font-size: 170px; }
      #e-title span { display: block; }
      #e-bar { position: absolute; left: 120px; top: 600px; width: 900px; height: 22px; border-radius: 11px; background: #1aa6ec; }
      #e-sub { position: absolute; left: 124px; top: 650px; font-family: "Open Sans", sans-serif; font-weight: 700; font-size: 52px; white-space: nowrap; }
      #e-plate { position: absolute; left: 120px; top: 760px; width: 560px; height: 140px; border-radius: 28px; background: #eaf6fd; }
      #e-plate img { position: absolute; left: 50px; top: 30px; height: 80px; width: auto; }
    </style>
  </head>
  <body>
    <!-- Doc 3 · Productivity Transformation. Voice is the clock; see ../SPEC.md. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="34" data-width="1920" data-height="1080">

      <div id="sa" class="clip scene" data-start="0" data-duration="4.7" data-track-index="1" style="z-index: 1">
        <div class="bg" style="background: #ffffff"></div>
        <div class="big" id="a-task">Same task</div>
        <div class="big" id="a-ways">Two ways</div>
      </div>

      <div id="sb" class="clip scene" data-start="4.3" data-duration="10.7" data-track-index="2" style="z-index: 2">
        <div class="bg" id="b-left" style="background: #ffffff" data-layout-allow-occlusion></div>
        <div id="b-right"></div>
        <div class="quiet" id="b-old">The old way</div>
        <div class="quiet" id="b-new">With Claude</div>
        <div class="big churn" id="b-w1">Open tabs</div>
        <div class="big churn" id="b-w2">Copy</div>
        <div class="big churn" id="b-w3">Format</div>
        <div class="big churn" id="b-w4">By hand</div>
        <div id="b-box">
          <div class="pl" id="b-l1"></div><div class="pl" id="b-l2"></div><div class="pl" id="b-l3"></div>
          <div id="b-cursor"></div>
        </div>
        <div id="b-done"><svg viewBox="0 0 140 140" fill="none" stroke="#0b1e46" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"><polyline points="24,74 58,106 118,36" /></svg></div>
        <div class="big" id="b-prompt"><span>One</span><span>clear</span><br /><span>prompt</span></div>
      </div>

      <div id="sc" class="clip scene" data-start="14.6" data-duration="7.8" data-track-index="1" style="z-index: 3">
        <div class="bg" id="c-bg" style="background: #ffffff"></div>
        <svg id="c-paths" viewBox="0 0 1920 160" fill="none" stroke="#0b1e46" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" data-layout-ignore>
          <path class="c-path" pathLength="100" d="M120 80 H900" />
          <path class="c-path" pathLength="100" d="M1800 80 H1020" />
          <circle id="c-dot" cx="960" cy="80" r="44" fill="#1aa6ec" stroke="none" />
        </svg>
        <div class="slot" id="c-word" data-layout-allow-overflow><div class="reel" id="c-reel"><div>Both paths</div><div>Same place</div></div></div>
        <div class="big" id="c-a">A person</div>
        <div class="big" id="c-rev">Reviews</div>
        <svg id="c-person" viewBox="0 0 150 150" fill="none" stroke="#0b1e46" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="58" cy="44" r="28" /><path d="M10 140 C10 100 34 84 58 84 C72 84 84 88 94 96" />
          <polyline id="c-tick" points="88,118 106,136 142,96" stroke="#0e7bb5" />
        </svg>
      </div>

      <div id="sd" class="clip scene" data-start="22.0" data-duration="3.7" data-track-index="2" style="z-index: 4">
        <div class="bg" id="d-bg" style="background: #1aa6ec"></div>
        <svg id="d-loop" viewBox="0 0 1000 520" fill="none" stroke="#0b1e46" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" data-layout-ignore>
          <path id="d-arc" pathLength="100" d="M820 120 A440 220 0 1 0 900 300" />
          <polyline id="d-head" points="850,250 902,304 950,240" />
        </svg>
        <div class="big" id="d-you">You</div>
        <div class="big" id="d-line"><span>stay in</span><span>the loop</span></div>
      </div>

      <div id="se" class="clip scene" data-start="25.4" data-duration="8.6" data-track-index="1" style="z-index: 5">
        <div class="bg" id="e-bg" style="background: #ffffff"></div>
        <div class="big" id="e-title" data-hold><span>Productivity</span><span>Transformation</span></div>
        <div id="e-bar" data-hold></div>
        <div id="e-sub" data-hold>Part 4 · Real-World Workflows</div>
        <div id="e-plate" data-hold data-layout-allow-overflow><img src="assets/cloudswyft-logo-on-light.png" alt="CloudSwyft" /></div>
      </div>

      <audio id="voice" class="clip" src="assets/doc3.mp3" data-start="0" data-duration="23.68" data-track-index="5" data-volume="1"></audio>
      <audio id="pop1" class="clip" src="assets/sfx-pop.mp3" data-start="5.28" data-duration="0.3" data-track-index="6" data-volume="0.45"></audio>
      <audio id="pop2" class="clip" src="assets/sfx-pop.mp3" data-start="5.78" data-duration="0.3" data-track-index="6" data-volume="0.5"></audio>
      <audio id="pop3" class="clip" src="assets/sfx-pop.mp3" data-start="6.31" data-duration="0.3" data-track-index="6" data-volume="0.55"></audio>
      <audio id="pop4" class="clip" src="assets/sfx-pop.mp3" data-start="6.88" data-duration="0.3" data-track-index="6" data-volume="0.6"></audio>
      <audio id="popd" class="clip" src="assets/sfx-pop.mp3" data-start="11.51" data-duration="0.3" data-track-index="6" data-volume="0.75"></audio>
      <audio id="pop5" class="clip" src="assets/sfx-pop.mp3" data-start="17.91" data-duration="0.3" data-track-index="6" data-volume="0.7"></audio>
      <audio id="pop6" class="clip" src="assets/sfx-pop.mp3" data-start="18.51" data-duration="0.3" data-track-index="6" data-volume="0.8"></audio>
      <audio id="wh1" class="clip" src="assets/sfx-whoosh.mp3" data-start="3.75" data-duration="1.2" data-track-index="7" data-volume="0.24" data-fade-out="0.4"></audio>
      <audio id="wh2" class="clip" src="assets/sfx-whoosh.mp3" data-start="14.05" data-duration="1.2" data-track-index="7" data-volume="0.26" data-fade-out="0.4"></audio>
      <audio id="wh3" class="clip" src="assets/sfx-whoosh.mp3" data-start="21.45" data-duration="1.2" data-track-index="7" data-volume="0.24" data-fade-out="0.4"></audio>
      <audio id="wh4" class="clip" src="assets/sfx-whoosh.mp3" data-start="24.85" data-duration="1.4" data-track-index="7" data-volume="0.28" data-fade-out="0.5"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const land = (sel, t, blur = 10) =>
        tl.fromTo(sel, { opacity: 0, filter: "blur(" + blur + "px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power4.out" }, t);
      const pop = (sel, t) => {
        tl.set(sel, { opacity: 1 }, t);
        tl.fromTo(sel, { scale: 0 }, { scale: 1, duration: 0.45, ease: "elastic.out(1, 0.55)" }, t);
      };

      // A · "Same task. Two ways." SAME TASK is on screen from frame 0.
      land("#a-ways", 1.01);

      // B · the frame splits: the sky "Claude" half slides in over the right.
      tl.fromTo("#b-right", { x: 960 }, { x: 0, duration: 0.45, ease: "expo.out" }, 4.3);
      land("#b-old", 4.55, 6);
      land("#b-new", 4.7, 6);
      // The old way churns: each step lands a little crooked (static tilt, no wobble).
      [["#b-w1", 5.37, -3], ["#b-w2", 5.87, 2], ["#b-w3", 6.4, -2], ["#b-w4", 6.97, 3]].forEach(([sel, t, r]) => {
        tl.fromTo(sel, { opacity: 0, x: -60, rotation: 0 }, { opacity: 1, x: 0, rotation: r, duration: 0.22, ease: "power4.out" }, t);
      });
      // The other way stays calm: one prompt box, typed lines, then the words.
      tl.fromTo("#b-box", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 7.84);
      ["#b-l1", "#b-l2", "#b-l3"].forEach((sel, i) => {
        tl.fromTo(sel, { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 8.3 + i * 0.45);
      });
      tl.fromTo("#b-cursor", { x: -380, y: -110 }, { x: 0, y: 0, duration: 1.4, ease: "none" }, 8.3);
      tl.fromTo("#b-prompt span", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.12, ease: "power4.out" }, 9.8);
      // While the old way is still going, the prompt side is already done.
      pop("#b-done", 11.6);
      tl.to(["#b-w1", "#b-w2", "#b-w3", "#b-w4"], { opacity: 0.3, duration: 0.4, stagger: 0.1, ease: "power2.inOut" }, 12.6);

      // C · "Both paths end in the same place: a person reviewing the result."
      tl.fromTo("#c-bg", { clipPath: "inset(0 50% 0 50%)" }, { clipPath: "inset(0 0% 0 0%)", duration: 0.45, ease: "power2.inOut" }, 14.6);
      tl.fromTo(".c-path", { strokeDasharray: "100 120", strokeDashoffset: 110 }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, 15.0);
      tl.fromTo("#c-dot", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.45, ease: "elastic.out(1, 0.55)" }, 15.9);
      land("#c-word", 14.95);
      tl.fromTo("#c-reel", { y: 0 }, { y: -230, duration: 0.3, ease: "power3.out" }, 16.5);
      tl.set("#c-reel > div:nth-child(1)", { opacity: 0 }, 16.8);
      tl.to(["#c-word", "#c-paths"], { opacity: 0, filter: "blur(10px)", duration: 0.18, ease: "power2.in" }, 17.75);
      land("#c-a", 18.0);
      pop("#c-person", 18.0);
      land("#c-rev", 18.5);
      tl.fromTo("#c-tick", { strokeDasharray: "100 120", strokeDashoffset: 110 }, { strokeDashoffset: 0, duration: 0.3, ease: "power3.out" }, 18.6);

      // D · sky floods up. "You stay in the loop." The loop draws itself around YOU.
      tl.fromTo("#d-bg", { clipPath: "inset(100% 0 0 0)" }, { clipPath: "inset(0% 0 0 0)", duration: 0.4, ease: "power2.inOut" }, 22.0);
      land("#d-you", 22.35);
      tl.fromTo("#d-line span", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.15, ease: "power4.out" }, 22.6);
      tl.fromTo("#d-arc", { strokeDasharray: "100 120", strokeDashoffset: 110 }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, 22.9);
      tl.fromTo("#d-head", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 23.55);

      // E · end card.
      tl.fromTo("#e-bg", { clipPath: "inset(0 0 0 100%)" }, { clipPath: "inset(0 0 0 0%)", duration: 0.4, ease: "power2.inOut" }, 25.4);
      tl.fromTo("#e-title span", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.12, ease: "power4.out" }, 25.9);
      tl.fromTo("#e-bar", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 26.3);
      land("#e-sub", 26.5, 8);
      tl.fromTo("#e-plate", { y: 420 }, { y: 0, duration: 0.6, ease: "expo.out" }, 26.9);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
